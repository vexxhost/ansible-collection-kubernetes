name: bump

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  kubernetes:
    if: ${{ github.repository == 'vexxhost/ansible-collection-kubernetes' }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./hack/bump/kubernetes.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: step-security/create-pull-request@50c103da2b9ca12cd5bc013fc6931051a5aa872b # v8.1.1
        with:
          token: ${{ github.token }}
          commit-message: "chore(deps): update kubernetes"
          signoff: true
          branch: bump/kubernetes
          delete-branch: true
          title: "chore(deps): update kubernetes"
          body: |
            ## Automated `kubernetes` update

            This PR updates the `kubernetes` binaries to the latest versions.
