---
- import_playbook: vexxhost.kubernetes.site

- name: Install cert-manager
  hosts: "{{ kubernetes_control_plane_group | default('controllers') }}"
  become: true
  vars_files:
    - "vars/{{ cert_manager_test_version | default('default') }}.yml"
  roles:
    - vexxhost.kubernetes.cert_manager
