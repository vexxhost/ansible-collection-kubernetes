---
# Kubernetes version
kubernetes_version: "{{ undef(hint='You must specify the exact Kubernetes version') }}"

# Name of Ansible group containing all control-plane nodes
kubernetes_control_plane_group: controllers

# TODO(mnaser): We should remove this at some point.
kubernetes_repository_apt: "deb https://apt.kubernetes.io/ kubernetes-xenial main"

# Kubernetes image repository (leave undefined to use the `kubeadm` default)
kubernetes_image_repository: registry.k8s.io

# Directory for kubeadm patches on each node
kubernetes_kubeadm_patches_dir: /etc/kubernetes/kubeadm-patches

# Strategic merge patches for components kubeadm writes, keyed by target:
# etcd, kube-apiserver, kube-controller-manager, kube-scheduler,
# kubeletconfiguration (Kubernetes 1.25+) and corednsdeployment (1.31+).
# They are merged on top of the patches this role manages and apply whenever
# kubeadm writes the component (join and upgrades). Patches are stored on each
# node, so they can be set per host or per group.
#
#   kubernetes_kubeadm_patches:
#     kube-apiserver:
#       spec:
#         containers:
#           - name: kube-apiserver
#             resources:
#               requests:
#                 cpu: "1"
kubernetes_kubeadm_patches: {}

# Extra arguments for the kubelet and control plane components, merged on top
# of the ones this role sets (see roles/kubernetes/vars/main.yml). Set an
# argument to null to remove one the role sets. Kubelet arguments only apply to
# nodes as they join the cluster. Control plane arguments are merged into the
# cluster configuration stored in the kube-system/kubeadm-config ConfigMap on
# every run (other stored arguments are kept), and kubeadm applies them when
# it next writes the components: on upgrades and when control plane nodes join.
#
#   kubernetes_kubeadm_extra_args:
#     kubelet:
#       max-pods: "200"
#     apiServer:
#       audit-log-maxage: "30"
kubernetes_kubeadm_extra_args:
  kubelet: {}
  etcd: {}
  apiServer: {}
  controllerManager: {}
  scheduler: {}

# Taints applied by kubeadm when a new Node object is registered. Leave this
# null to preserve kubeadm's defaults. This can be set per host for workflows
# that must keep a replacement node unschedulable from its first registration.
kubernetes_kubeadm_node_registration_taints: null

# Kubelet feature gates rendered into the KubeletConfiguration. These are
# merged on top of the role-managed gates (kubernetes_kubelet_managed_feature_gates).
kubernetes_kubelet_feature_gates: {}

# Cgroup driver rendered into the KubeletConfiguration. It must match the
# driver runc uses, which the vexxhost.containers.containerd role leaves at
# cgroupfs (it does not set SystemdCgroup). kubeadm would otherwise default to
# systemd, which kubelets before 1.31 (and any kubelet on containerd 1.7, which
# can't report its driver) use as is.
kubernetes_kubelet_cgroup_driver: cgroupfs

# Deprecated: Please use "kubelet_node_ip" instead.
kubernetes_node_ip: "{{ kubelet_node_ip }}"

# Deprecated: Please use "kubelet_cri_socket" instead.
kubernetes_cri_socket: "{{ kubelet_cri_socket }}"

# Deprecated: Please use "kubelet_allow_unsafe_swap" instead.
kubernetes_allow_unsafe_swap: false

# If the deployment is in a non-init namespace (docker/LXC/...)
# then kube-proxy must be prevented from ajusting conntrack settings
kubernetes_non_init_namespace: "{{ ansible_connection == 'community.docker.docker' }}"

# select the node selector for the CoreDNS pods.
kubernetes_coredns_node_selector:
  openstack-control-plane: enabled

# Transfer kube-vip ownership before disrupting a controller in an HA cluster.
kubernetes_upgrade_vip_handoff: >-
  {{
    kube_vip_enabled | default(true) | bool
    and kube_vip_mode | default('arp') == 'arp'
    and groups[kubernetes_control_plane_group] | length > 1
  }}
kubernetes_upgrade_operation_timeout: 1800

# Protected etcd snapshots are retained on the bootstrap node and deployer.
kubernetes_etcd_snapshot_directory: ~/.local/state/kubernetes-upgrades

# Allow custom CA usage in the cluster
kubernetes_allow_custom_ca: false

# Do not use kube-proxy. Instead use/configure cni replacement.
kubernetes_remove_kube_proxy: false

# Health checks run between upgrade steps
kubernetes_health_check_components:
  - etcd
  - kube-apiserver
  - kube-controller-manager
  - kube-scheduler
kubernetes_health_check_retries: 30
kubernetes_health_check_delay: 10
kubernetes_health_check_timeout: 300s

# Kubelet binary for the target version and the path the kubelet runs from
# (see the kubelet role)
kubernetes_kubelet_download_dest: "{{ download_artifact_work_directory | default('/var/lib/downloads') }}/kubelet-{{ kubernetes_version }}"
kubernetes_kubelet_live_binary_dest: /usr/bin/kubelet

# Upgrade kubelets to kubernetes_version on nodes already in the cluster.
# Set to false to upgrade only the control plane in this run: those nodes keep
# running their current kubelet (within the version skew Kubernetes supports)
# until a later run with this enabled.  New nodes always join with the
# kubelet for kubernetes_version.
kubernetes_kubelet_upgrade: true

# Keep running containers when kubelets are upgraded from 1.30 to 1.31.
# Kubernetes 1.31 changed how the kubelet hashes containers, so without this
# every running container restarts when its node's kubelet is upgraded.  When
# enabled, the stored hashes are rewritten in containerd's metadata database
# (with a backup next to it) while the kubelet and containerd are stopped.
kubernetes_kubelet_container_hash_migration: true

# Cluster-scoped admission policy used on affected Kubernetes releases when at
# least one node runs without pod QoS cgroups.  It blocks explicit pods/resize
# requests that would otherwise panic that node's kubelet.  The upgrade check
# controls the affected version ranges and removes the policy once no node
# needs it or the target release contains the upstream fix.
kubernetes_resize_admission_guard_name: vexxhost-kubelet-resize-guard
kubernetes_resize_admission_guard_validation_message: >-
  In-place pod resize is disabled because a kubelet without pod QoS cgroups is
  vulnerable to kubernetes/kubernetes#137993.
kubernetes_resize_admission_guard_retries: 30
kubernetes_resize_admission_guard_delay: 2
