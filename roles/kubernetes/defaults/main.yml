---
# Kubernetes version
kubernetes_version: "{{ undef(hint='You must specify the exact Kubernetes version') }}"

# Name of Ansible group containing all control-plane nodes
kubernetes_control_plane_group: controllers

# TODO(mnaser): We should remove this at some point.
kubernetes_repository_apt: "deb https://apt.kubernetes.io/ kubernetes-xenial main"

# Kubernetes image repository (leave undefined to use the `kubeadm` default)
kubernetes_image_repository: registry.k8s.io

# Directory for kubeadm patches on each node
kubernetes_kubeadm_patches_dir: /etc/kubernetes/kubeadm-patches

# Strategic merge patches for components kubeadm writes, keyed by target:
# etcd, kube-apiserver, kube-controller-manager, kube-scheduler,
# kubeletconfiguration (Kubernetes 1.25+) and corednsdeployment (1.31+).
# They are merged on top of the patches this role manages and apply whenever
# kubeadm writes the component (join and upgrades). Patches are stored on each
# node, so they can be set per host or per group.
#
#   kubernetes_kubeadm_patches:
#     kube-apiserver:
#       spec:
#         containers:
#           - name: kube-apiserver
#             resources:
#               requests:
#                 cpu: "1"
kubernetes_kubeadm_patches: {}

# Extra arguments for the kubelet and control plane components, merged on top
# of the ones this role sets (see roles/kubernetes/vars/main.yml). Set an
# argument to null to remove one the role sets. Kubelet arguments only apply to
# nodes as they join the cluster; control plane arguments apply on upgrades.
#
#   kubernetes_kubeadm_extra_args:
#     kubelet:
#       max-pods: "200"
#     apiServer:
#       audit-log-maxage: "30"
kubernetes_kubeadm_extra_args:
  kubelet: {}
  etcd: {}
  apiServer: {}
  controllerManager: {}
  scheduler: {}

# Deprecated: Please use "kubelet_node_ip" instead.
kubernetes_node_ip: "{{ kubelet_node_ip }}"

# Deprecated: Please use "kubelet_cri_socket" instead.
kubernetes_cri_socket: "{{ kubelet_cri_socket }}"

# Deprecated: Please use "kubelet_allow_unsafe_swap" instead.
kubernetes_allow_unsafe_swap: false

# If the deployment is in a non-init namespace (docker/LXC/...)
# then kube-proxy must be prevented from ajusting conntrack settings
kubernetes_non_init_namespace: "{{ ansible_connection == 'community.docker.docker' }}"

# select the node selector for the CoreDNS pods.
kubernetes_coredns_node_selector:
  openstack-control-plane: enabled

# Allow custom CA usage in the cluster
kubernetes_allow_custom_ca: false

# Do not use kube-proxy. Instead use/configure cni replacement.
kubernetes_remove_kube_proxy: false
