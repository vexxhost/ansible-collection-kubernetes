---
# kubeadm configuration API version for kubernetes_version
kubernetes_kubeadm_api_version: >-
  {{
    'v1beta2' if kubernetes_version is version('1.22.0', '<') else
    'v1beta3' if kubernetes_version is version('1.31.0', '<') else
    'v1beta4'
  }}

# Component arguments rendered into the kubeadm configuration (see the
# vexxhost.kubernetes.kubeadm_args filter for the format).
kubernetes_kubeadm_kubelet_args: >-
  {{
    ({'fail-swap-on': 'false'} if kubernetes_allow_unsafe_swap | bool else {})
    | combine({'node-ip': kubernetes_node_ip})
    | combine({'container-runtime': 'remote'} if kubernetes_version is version('1.24.0', '<') else {})
    | combine({'container-runtime-endpoint': kubelet_cri_socket})
    | combine(kubernetes_kubeadm_extra_args.kubelet | default({}))
  }}

kubernetes_kubeadm_tls_args: >-
  {{ {'tls-min-version': 'VersionTLS13'} if kubernetes_version is version('1.28.0', '>=') else {} }}

# NOTE: API servers before 1.28 can't connect to an etcd that only accepts
#       TLS 1.3, and "kubeadm upgrade apply" upgrades etcd before the API
#       server, so only require TLS 1.3 once the cluster already runs 1.28.
kubernetes_kubeadm_etcd_args: >-
  {{
    (
      {'tls-min-version': 'TLS1.3'}
      if kubernetes_version is version('1.28.0', '>=')
      and kubernetes_upgrade_check_cluster_version | default(kubernetes_version) is version('1.28.0', '>=')
      else {}
    )
    | combine(kubernetes_kubeadm_extra_args.etcd | default({}))
  }}

kubernetes_kubeadm_api_server_args: >-
  {{
    kubernetes_kubeadm_tls_args
    | combine({
        'oidc-username-claim': kubernetes_oidc_username_claim | default(''),
        'oidc-issuer-url': kubernetes_oidc_issuer_url,
        'oidc-client-id': kubernetes_oidc_client_id | default(''),
      } if kubernetes_oidc_issuer_url is defined else {})
    | combine(kubernetes_kubeadm_extra_args.apiServer | default({}))
  }}

kubernetes_kubeadm_controller_manager_args: >-
  {{
    {'bind-address': '0.0.0.0'}
    | combine(kubernetes_kubeadm_tls_args)
    | combine(kubernetes_kubeadm_extra_args.controllerManager | default({}))
  }}

kubernetes_kubeadm_scheduler_args: >-
  {{
    {'bind-address': '0.0.0.0'}
    | combine(kubernetes_kubeadm_tls_args)
    | combine(kubernetes_kubeadm_extra_args.scheduler | default({}))
  }}

# NOTE: In-place pod resize is enabled by default from 1.33 and needs pod
#       cgroups: with --cgroups-per-qos=false, which this role used to set and
#       which nodes that joined before keep (kubeadm does not rewrite
#       kubeadm-flags.env on upgrades), the kubelet panics in
#       doPodResizeAction.  The kubelet configuration is shared by every node,
#       so keep it off on 1.33 and 1.34.  From 1.35 the gate is GA and locked,
#       so it can no longer be turned off.
kubernetes_kubelet_managed_feature_gates: >-
  {{
    {'InPlacePodVerticalScaling': false}
    if kubernetes_version is version('1.33.0', '>=') and kubernetes_version is version('1.35.0', '<')
    else {}
  }}

# kubeadm patch targets supported by kubernetes_version
kubernetes_kubeadm_patch_targets: >-
  {{
    ['etcd', 'kube-apiserver', 'kube-controller-manager', 'kube-scheduler']
    + (['kubeletconfiguration'] if kubernetes_version is version('1.25.0', '>=') else [])
    + (['corednsdeployment'] if kubernetes_version is version('1.31.0', '>=') else [])
  }}

# NOTE: kubeadm recreates the CoreDNS Deployment during upgrades, which drops
#       the node selector until the end of the run; the patch keeps it.
kubernetes_kubeadm_managed_patches: >-
  {{
    {'corednsdeployment': {'spec': {'template': {'spec': {'nodeSelector': kubernetes_coredns_node_selector}}}}}
    if 'corednsdeployment' in kubernetes_kubeadm_patch_targets and kubernetes_coredns_node_selector | default({}) | length > 0
    else {}
  }}

# Arguments for "kubeadm upgrade apply" and "kubeadm upgrade node"
kubernetes_kubeadm_upgrade_args: >-
  {{ '--patches ' ~ kubernetes_kubeadm_patches_dir if kubernetes_version is version('1.22.0', '>=') else '' }}
