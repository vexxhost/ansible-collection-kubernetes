---
- name: Determine node to use for bootstrapping cluster
  block:
    - name: Check if any control plane is bootstrapped
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: kubernetes_admin_conf_stat
      loop: "{{ groups[kubernetes_control_plane_group] }}"
      delegate_to: "{{ item }}"
      delegate_facts: true

- name: Pick node from pre-existing cluster
  ansible.builtin.set_fact:
    kubernetes_bootstrap_node: "{{ kubernetes_admin_conf_stat.results | selectattr('stat.exists', 'equalto', true) | map(attribute='item') | first }}"
  when: kubernetes_admin_conf_stat.results | selectattr('stat.exists', 'equalto', true) | length > 0

- name: Select first node to initialize cluster
  ansible.builtin.set_fact:
    kubernetes_bootstrap_node: "{{ groups[kubernetes_control_plane_group] | first }}"
  when: kubernetes_admin_conf_stat.results | selectattr('stat.exists', 'equalto', true) | length == 0

- name: Print selected bootstrap node
  ansible.builtin.debug:
    msg: "{{ kubernetes_bootstrap_node }}"

# The existing preflight has run and the usable API controller is now known.
- name: Reject proxy resources and host residue before application preparation
  when:
    - kubernetes_remove_kube_proxy | bool
    - kubernetes_upgrade_check_cluster_version is defined
  run_once: true
  ansible.builtin.include_tasks: kube-proxy-check.yml

- name: Prepare existing-cluster application prerequisites
  when:
    - kubernetes_upgrade_lifecycle_role | length > 0
    - kubernetes_upgrade_check_cluster_version is defined
    - not ansible_check_mode
  run_once: true
  ansible.builtin.include_role:
    name: "{{ kubernetes_upgrade_lifecycle_role }}"
    tasks_from: prerequisites

- name: Upload cluster configuration for bootstrap node
  ansible.builtin.template:
    src: kubeadm.yaml.j2
    dest: /etc/kubernetes/kubeadm.yaml
    owner: root
    group: root
    mode: "0640"
  when: inventory_hostname == kubernetes_bootstrap_node

- name: Upload cluster CA certificate
  when: kubernetes_allow_custom_ca
  block:
    - name: Create pki folder
      ansible.builtin.file:
        path: /etc/kubernetes/pki
        state: directory
        owner: root
        group: root
        recurse: true
    - name: Create kubernetes ca key
      ansible.builtin.copy:
        content: "{{ kubernetes_custom_ca_key }}"
        dest: /etc/kubernetes/pki/ca.key
        mode: "0600"
      when:
        - (kubernetes_custom_ca_key is defined) and (kubernetes_custom_ca_key|length > 0)
    - name: Create kubernetes ca cert
      ansible.builtin.copy:
        content: "{{ kubernetes_custom_ca_cert }}"
        dest: /etc/kubernetes/pki/ca.crt
        mode: "0644"
      when:
        - (kubernetes_custom_ca_cert is defined) and (kubernetes_custom_ca_cert|length > 0)
    - name: Create etcd-ca key
      ansible.builtin.copy:
        content: "{{ kubernetes_custom_etcd_ca_key }}"
        dest: /etc/kubernetes/pki/etcd/ca.key
        mode: "0600"
      when:
        - (kubernetes_custom_etcd_ca_key is defined) and (kubernetes_custom_etcd_ca_key|length > 0)
    - name: Create etcd-ca cert
      ansible.builtin.copy:
        content: "{{ kubernetes_custom_etcd_ca_cert }}"
        dest: /etc/kubernetes/pki/etcd/ca.crt
        mode: "0644"
      when:
        - (kubernetes_custom_etcd_ca_cert is defined) and (kubernetes_custom_etcd_ca_cert|length > 0)
    - name: Create front-proxy-ca key
      ansible.builtin.copy:
        content: "{{ kubernetes_custom_front_proxy_ca_key }}"
        dest: /etc/kubernetes/pki/front-proxy-ca.key
        mode: "0600"
      when:
        - (kubernetes_custom_front_proxy_ca_key is defined) and (kubernetes_custom_front_proxy_ca_key|length > 0)
    - name: Create front-proxy-ca cert
      ansible.builtin.copy:
        content: "{{ kubernetes_custom_front_proxy_ca_cert }}"
        dest: /etc/kubernetes/pki/front-proxy-ca.crt
        mode: "0644"
      when:
        - (kubernetes_custom_front_proxy_ca_cert is defined) and (kubernetes_custom_front_proxy_ca_cert|length > 0)

- name: Initialize cluster
  throttle: 1
  ansible.builtin.shell: |
    kubeadm init --config /etc/kubernetes/kubeadm.yaml --upload-certs \
    {%- if kubernetes_remove_kube_proxy %}
      --skip-phases=addon/kube-proxy \
    {%- endif %}
      --ignore-preflight-errors=DirAvailable--etc-kubernetes-manifests{% if kubernetes_allow_unsafe_swap %},Swap{% endif %}
  args:
    creates: /etc/kubernetes/admin.conf
  environment:
    PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  when: inventory_hostname == kubernetes_bootstrap_node

# The first API server is now available. Install the guard before any other
# control-plane node joins and becomes schedulable.
- name: Guard in-place pod resize before additional control planes join
  when: kubernetes_version is version('1.35.0', '>=')
  run_once: true
  ansible.builtin.include_tasks: resize-admission-guard.yml

# NOTE: Before any node joins, so new control plane nodes get the arguments
#       too, and before "kubeadm upgrade apply" in control-plane.yml.
- name: Save etcd before changing an existing cluster's upgrade configuration
  when:
    - kubernetes_upgrade_check_upgrade_required | default(false) | bool
    - kubernetes_upgrade_check_cluster_configuration.etcd.external is not defined
  run_once: true
  ansible.builtin.include_tasks: etcd-snapshot.yml

- name: Update the stored kubeadm cluster configuration
  ansible.builtin.include_tasks: cluster-configuration.yml

- name: Preserve controller kubelet HA before kubeadm enables local mode
  when:
    - kubernetes_upgrade_check_cluster_version is defined
    - kubernetes_version is version('1.33.0', '>=')
    - kubernetes_upgrade_vip_handoff | bool
  run_once: true
  delegate_to: "{{ item }}"
  vexxhost.kubernetes.kubelet_ha_endpoint:
    hostname: "{{ kubernetes_kubelet_ha_hostname }}"
    # Use the existing API VIP; a second address setting could split HA routes.
    address: "{{ kube_vip_address | default(kubernetes_keepalived_vip | default(kubernetes_hostname)) }}"
    control_plane_endpoint: "https://{{ kubernetes_kubeadm_stored_cluster_configuration.controlPlaneEndpoint }}"
    node_address: "{{ hostvars[item].kubelet_node_ip | default(omit) }}"
    node_name: "{{ hostvars[item].kubernetes_kubelet_node_name }}"
  loop: "{{ ansible_play_hosts | intersect(groups[kubernetes_control_plane_group]) }}"

- name: Check if the node is already part of the cluster
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubernetes_kubelet_stat

- name: Join cluster
  ansible.builtin.include_tasks: join-cluster.yml
  when:
    - inventory_hostname != kubernetes_bootstrap_node
    - not kubernetes_kubelet_stat.stat.exists
