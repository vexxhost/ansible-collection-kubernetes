---
- name: Bootstrap cluster
  ansible.builtin.include_tasks: bootstrap-cluster.yml

- name: Create folder for admin configuration
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Creating a symlink for admin configuration file
  ansible.builtin.file:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    state: link
    force: true

- name: Add bash autocomplete for kubectl
  ansible.builtin.lineinfile:
    path: /root/.bashrc
    line: "source <(kubectl completion bash)"
    insertbefore: EOF

- name: Install Kubernetes python package using PIP
  when: >
    (ansible_facts['distribution'] == 'Ubuntu' and ansible_facts['distribution_major_version'] is version('22', '<=')) or
    (ansible_facts['distribution'] == 'Debian' and ansible_facts['distribution_major_version'] is version('12', '<=')) or
    (ansible_facts['distribution'] in ['AlmaLinux', 'RedHat', 'Rocky'] and ansible_facts['distribution_major_version'] is version('8', '<='))
  block:
    # TODO(fitbeard): Move common system packages from all roles to dedicated role.
    - name: Install PIP
      ansible.builtin.package:
        name:
          - python3-pip
          - python3-cryptography

    - name: Install Kubernetes Python package using pip on supported systems
      ansible.builtin.pip:
        name: kubernetes

- name: Install Kubernetes Python package using package manager
  when: >
    (ansible_facts['distribution'] == 'Ubuntu' and ansible_facts['distribution_major_version'] is version('22', '>')) or
    (ansible_facts['distribution'] == 'Debian' and ansible_facts['distribution_major_version'] is version('12', '>')) or
    (ansible_facts['distribution'] in ['AlmaLinux', 'RedHat', 'Rocky'] and ansible_facts['distribution_major_version'] is version('8', '>'))
  block:
    - name: Enable EPEL repository
      ansible.builtin.package:
        name: epel-release
      when: ansible_facts['os_family'] == "RedHat"

    - name: Install Kubernetes Python package using package manager on supported systems
      ansible.builtin.package:
        name: python3-kubernetes

- name: Allow workload on control plane node
  kubernetes.core.k8s_taint:
    state: absent
    name: "{{ kubelet_hostname }}"
    taints:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
      - effect: NoSchedule
        key: node-role.kubernetes.io/master

- name: Check super-admin kubeconfig path
  ansible.builtin.stat:
    path: /etc/kubernetes/super-admin.conf
    get_attributes: false
    get_checksum: false
    get_mime: false
  register: kubernetes_super_admin_conf_stat
  when:
    - kubernetes_version is version('1.29.0', '>=')

# NOTE: Older kube-vip manifests mounted this path without a hostPath type,
#       so the container runtime created it as an empty directory before kubeadm 1.29+
#       could write the file, which breaks "kubeadm upgrade".
- name: Remove invalid super-admin kubeconfig directory
  ansible.builtin.file:
    path: /etc/kubernetes/super-admin.conf
    state: absent
  when:
    - kubernetes_version is version('1.29.0', '>=')
    - kubernetes_super_admin_conf_stat.stat.isdir | default(false)

- name: Upgrade if necessary
  when:
    - kubernetes_upgrade_check_upgrade_required is defined
    - kubernetes_upgrade_check_upgrade_required | bool
  block:
    - name: Start an upgrade
      run_once: true
      changed_when: true
      ansible.builtin.command:
        cmd: kubeadm upgrade apply --v=5 --yes v{{ kubernetes_version }} {{ kubernetes_kubeadm_upgrade_args }}

    - name: Wait for the control plane after the upgrade
      run_once: true
      ansible.builtin.include_tasks: health-check.yml

    # NOTE: Upgrade the other control plane nodes one at a time and wait for
    #       the whole control plane to be healthy in between, so etcd and the
    #       API servers never restart on more than one node at once.
    - name: Upgrade the control plane nodes one at a time
      run_once: true
      ansible.builtin.include_tasks: control-plane-upgrade-node.yml
      loop: "{{ ansible_play_hosts | select('in', groups[kubernetes_control_plane_group]) | list }}"
      loop_control:
        loop_var: kubernetes_control_plane_upgrade_host
