---
- name: Get the kubelet version of the node
  delegate_to: "{{ kubernetes_bootstrap_node | default(groups[kubernetes_control_plane_group][0]) }}"
  kubernetes.core.k8s_info:
    kubeconfig: /etc/kubernetes/admin.conf
    kind: Node
    name: "{{ hostvars[kubernetes_kubelet_upgrade_host].kubernetes_kubelet_node_name }}"
  register: kubernetes_kubelet_upgrade_node

- name: Set the kubelet version of the node
  ansible.builtin.set_fact:
    kubernetes_kubelet_upgrade_current: >-
      {{
        (kubernetes_kubelet_upgrade_node.resources | first).status.nodeInfo.kubeletVersion | regex_replace('^v', '')
        if kubernetes_kubelet_upgrade_node.resources | length > 0 else ''
      }}

# NOTE: The 1.35 kubelet expects actuated_pods_state to cover every pod in
#       allocated_pods_state, but older kubelets leave it missing or
#       incomplete, so the new kubelet panics in doPodResizeAction ("Missing
#       actuated resource record").  In-place resize is off before 1.35, so
#       the allocated state matches what is running and can be copied.  Once
#       a node runs 1.35+, the kubelet owns the file: only seed it if missing.
- name: Check the kubelet resize state
  when:
    - kubernetes_kubelet_upgrade_current | length > 0
    - kubernetes_version is version('1.35.0', '>=')
  delegate_to: "{{ kubernetes_kubelet_upgrade_host }}"
  ansible.builtin.stat:
    path: "/var/lib/kubelet/{{ item }}"
  loop:
    - allocated_pods_state
    - actuated_pods_state
  register: kubernetes_kubelet_resize_state

- name: Upgrade the kubelet
  when:
    - kubernetes_kubelet_upgrade_current | length > 0
    - kubernetes_kubelet_upgrade_required | bool or kubernetes_kubelet_resize_state_seed | bool
  vars:
    kubernetes_kubelet_upgrade_control_plane: "{{ kubernetes_kubelet_upgrade_host in groups[kubernetes_control_plane_group] }}"
    kubernetes_kubelet_upgrade_required: "{{ kubernetes_kubelet_upgrade_current != kubernetes_version }}"
    kubernetes_kubelet_allocated_state: "{{ kubernetes_kubelet_resize_state.results[0].stat | default({}) }}"
    kubernetes_kubelet_actuated_state: "{{ kubernetes_kubelet_resize_state.results[1].stat | default({}) }}"
    kubernetes_kubelet_resize_state_seed: >-
      {{
        kubernetes_kubelet_allocated_state.exists | default(false)
        and (
          not kubernetes_kubelet_actuated_state.exists
          or (
            kubernetes_kubelet_upgrade_current is version('1.35.0', '<')
            and kubernetes_kubelet_actuated_state.checksum != kubernetes_kubelet_allocated_state.checksum
          )
        )
      }}
  block:
    - name: Upgrade the node configuration
      when: kubernetes_kubelet_upgrade_required | bool
      delegate_to: "{{ kubernetes_kubelet_upgrade_host }}"
      changed_when: true
      ansible.builtin.command:
        cmd: kubeadm upgrade node {{ kubernetes_kubeadm_upgrade_args }}
      register: kubernetes_kubelet_upgrade_kubeadm
      retries: 3
      delay: 10
      until: kubernetes_kubelet_upgrade_kubeadm is succeeded

    - name: Stop the kubelet
      delegate_to: "{{ kubernetes_kubelet_upgrade_host }}"
      ansible.builtin.service:
        name: kubelet
        state: stopped

    - name: Seed the kubelet actuated pod state
      when: kubernetes_kubelet_resize_state_seed | bool
      delegate_to: "{{ kubernetes_kubelet_upgrade_host }}"
      ansible.builtin.copy:
        src: /var/lib/kubelet/allocated_pods_state
        dest: /var/lib/kubelet/actuated_pods_state
        remote_src: true
        backup: true
        owner: root
        group: root
        mode: "0600"

    - name: Start the kubelet
      delegate_to: "{{ kubernetes_kubelet_upgrade_host }}"
      ansible.builtin.service:
        name: kubelet
        state: started
        enabled: true

    - name: Wait for the kubelet to be healthy
      delegate_to: "{{ kubernetes_kubelet_upgrade_host }}"
      ansible.builtin.uri:
        url: http://localhost:10248/healthz
      register: kubernetes_kubelet_upgrade_healthz
      retries: "{{ kubernetes_health_check_retries }}"
      delay: "{{ kubernetes_health_check_delay }}"
      until: kubernetes_kubelet_upgrade_healthz is succeeded

    # NOTE: Restarting a control plane kubelet restarts its static pods, so
    #       wait for the local API server before the next node is upgraded.
    - name: Wait for the local API server
      when: kubernetes_kubelet_upgrade_control_plane | bool
      delegate_to: "{{ kubernetes_kubelet_upgrade_host }}"
      ansible.builtin.uri:
        url: https://127.0.0.1:6443/readyz
        validate_certs: false
      register: kubernetes_kubelet_upgrade_readyz
      retries: "{{ kubernetes_health_check_retries }}"
      delay: "{{ kubernetes_health_check_delay }}"
      until: kubernetes_kubelet_upgrade_readyz is succeeded

    - name: Wait for the node to be ready
      delegate_to: "{{ kubernetes_bootstrap_node | default(groups[kubernetes_control_plane_group][0]) }}"
      kubernetes.core.k8s_info:
        kubeconfig: /etc/kubernetes/admin.conf
        kind: Node
        name: "{{ hostvars[kubernetes_kubelet_upgrade_host].kubernetes_kubelet_node_name }}"
        wait: true
        wait_condition:
          type: Ready
        wait_timeout: "{{ kubernetes_health_check_retries * kubernetes_health_check_delay }}"

    - name: Wait for the control plane after restarting its kubelet
      when: kubernetes_kubelet_upgrade_control_plane | bool
      ansible.builtin.include_tasks: health-check.yml
