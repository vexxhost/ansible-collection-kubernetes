---
- name: Get the kubelet version of the node
  delegate_to: "{{ kubernetes_bootstrap_node | default(groups[kubernetes_control_plane_group][0]) }}"
  kubernetes.core.k8s_info:
    kubeconfig: /etc/kubernetes/admin.conf
    kind: Node
    name: "{{ hostvars[kubernetes_kubelet_upgrade_host].kubernetes_kubelet_node_name }}"
  register: kubernetes_kubelet_upgrade_node

- name: Set the kubelet version of the node
  ansible.builtin.set_fact:
    kubernetes_kubelet_upgrade_current: >-
      {{
        (kubernetes_kubelet_upgrade_node.resources | first).status.nodeInfo.kubeletVersion | regex_replace('^v', '')
        if kubernetes_kubelet_upgrade_node.resources | length > 0 else ''
      }}

- name: Upgrade the kubelet
  when:
    - kubernetes_kubelet_upgrade_current | length > 0
    - kubernetes_kubelet_upgrade_required | bool
  vars:
    kubernetes_kubelet_upgrade_control_plane: "{{ kubernetes_kubelet_upgrade_host in groups[kubernetes_control_plane_group] }}"
    kubernetes_kubelet_upgrade_required: "{{ kubernetes_kubelet_upgrade_current != kubernetes_version }}"
    kubernetes_kubelet_hash_migration: >-
      {{
        kubernetes_kubelet_container_hash_migration | bool
        and kubernetes_kubelet_upgrade_current is version('1.31.0', '<')
        and kubernetes_version is version('1.31.0', '>=')
      }}
  block:
    - name: Upgrade the node configuration
      delegate_to: "{{ kubernetes_kubelet_upgrade_host }}"
      changed_when: true
      ansible.builtin.command:
        cmd: kubeadm upgrade node {{ kubernetes_kubeadm_upgrade_args }}
      register: kubernetes_kubelet_upgrade_kubeadm
      retries: 3
      delay: 10
      until: kubernetes_kubelet_upgrade_kubeadm is succeeded

    # NOTE: The 1.31 kubelet hashes the image exactly as written in the pod
    #       spec, so read the pod specs while the API is reachable.
    - name: List the pods on the node
      when: kubernetes_kubelet_hash_migration | bool
      delegate_to: "{{ kubernetes_bootstrap_node | default(groups[kubernetes_control_plane_group][0]) }}"
      kubernetes.core.k8s_info:
        kubeconfig: /etc/kubernetes/admin.conf
        kind: Pod
        field_selectors:
          - spec.nodeName={{ hostvars[kubernetes_kubelet_upgrade_host].kubernetes_kubelet_node_name }}
      register: kubernetes_kubelet_upgrade_pods

    - name: Stop the kubelet
      delegate_to: "{{ kubernetes_kubelet_upgrade_host }}"
      ansible.builtin.service:
        name: kubelet
        state: stopped

    - name: Plan the container hash migration
      when: kubernetes_kubelet_hash_migration | bool
      delegate_to: "{{ kubernetes_kubelet_upgrade_host }}"
      vexxhost.kubernetes.kubelet_container_hash_migration:
        pods: "{{ kubernetes_kubelet_upgrade_pods.resources }}"
      register: kubernetes_kubelet_hash_migration_plan

    # NOTE: Stopping containerd leaves running containers alone (its unit uses
    #       KillMode=process).
    - name: Migrate the container hashes
      when:
        - kubernetes_kubelet_hash_migration | bool
        - kubernetes_kubelet_hash_migration_plan.migrations | length > 0
      block:
        - name: Stop containerd
          delegate_to: "{{ kubernetes_kubelet_upgrade_host }}"
          ansible.builtin.service:
            name: containerd
            state: stopped

        - name: Rewrite the container hashes
          delegate_to: "{{ kubernetes_kubelet_upgrade_host }}"
          vexxhost.kubernetes.kubelet_container_hash_migration:
            migrations: "{{ kubernetes_kubelet_hash_migration_plan.migrations }}"
      always:
        - name: Start containerd
          delegate_to: "{{ kubernetes_kubelet_upgrade_host }}"
          ansible.builtin.service:
            name: containerd
            state: started

    # NOTE: Only switch to the new kubelet now, after "kubeadm upgrade node"
    #       and any migrations, right before it starts.
    - name: Switch to the new kubelet
      delegate_to: "{{ kubernetes_kubelet_upgrade_host }}"
      ansible.builtin.file:
        src: "{{ kubernetes_kubelet_download_dest }}"
        dest: "{{ kubernetes_kubelet_live_binary_dest }}"
        state: link
        force: true
        owner: root
        group: root

    - name: Start the kubelet
      delegate_to: "{{ kubernetes_kubelet_upgrade_host }}"
      ansible.builtin.service:
        name: kubelet
        state: started
        enabled: true

    - name: Wait for the kubelet to be healthy
      delegate_to: "{{ kubernetes_kubelet_upgrade_host }}"
      ansible.builtin.uri:
        url: http://localhost:10248/healthz
      register: kubernetes_kubelet_upgrade_healthz
      retries: "{{ kubernetes_health_check_retries }}"
      delay: "{{ kubernetes_health_check_delay }}"
      until: kubernetes_kubelet_upgrade_healthz is succeeded

    # NOTE: Restarting a control plane kubelet restarts its static pods, so
    #       wait for the local API server before the next node is upgraded.
    - name: Wait for the local API server
      when: kubernetes_kubelet_upgrade_control_plane | bool
      delegate_to: "{{ kubernetes_kubelet_upgrade_host }}"
      ansible.builtin.uri:
        url: https://127.0.0.1:6443/readyz
        validate_certs: false
      register: kubernetes_kubelet_upgrade_readyz
      retries: "{{ kubernetes_health_check_retries }}"
      delay: "{{ kubernetes_health_check_delay }}"
      until: kubernetes_kubelet_upgrade_readyz is succeeded

    - name: Wait for the node to be ready
      delegate_to: "{{ kubernetes_bootstrap_node | default(groups[kubernetes_control_plane_group][0]) }}"
      kubernetes.core.k8s_info:
        kubeconfig: /etc/kubernetes/admin.conf
        kind: Node
        name: "{{ hostvars[kubernetes_kubelet_upgrade_host].kubernetes_kubelet_node_name }}"
        wait: true
        wait_condition:
          type: Ready
        wait_timeout: "{{ kubernetes_health_check_retries * kubernetes_health_check_delay }}"

    - name: Wait for the control plane after restarting its kubelet
      when: kubernetes_kubelet_upgrade_control_plane | bool
      ansible.builtin.include_tasks: health-check.yml
  rescue:
    # NOTE: Leave the node running even if a step failed.  Before the switch
    #       to the new kubelet, this starts the previous kubelet again, which
    #       keeps the containers running.
    - name: Start the kubelet after a failed upgrade
      delegate_to: "{{ kubernetes_kubelet_upgrade_host }}"
      ansible.builtin.service:
        name: kubelet
        state: started

    - name: Fail the kubelet upgrade
      ansible.builtin.fail:
        msg: >-
          Upgrading the kubelet on {{ kubernetes_kubelet_upgrade_host }} failed:
          {{ ansible_failed_result.msg | default('see the failed task above') }}
