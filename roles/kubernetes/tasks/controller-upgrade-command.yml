---
- name: Upgrade one controller and wait for its health
  when: not ansible_check_mode
  block:
    - name: Run the controller kubeadm upgrade
      delegate_to: "{{ kubernetes_upgrade_host }}"
      changed_when: true
      async: 600
      poll: 5
      ansible.builtin.command:
        cmd: "{{ kubernetes_upgrade_command }}"

    - name: Finish the kubeadm DNS operation before proceeding
      ansible.builtin.include_tasks: coredns-upgrade.yml

    - name: Wait for the control plane
      ansible.builtin.include_tasks: health-check.yml
