---
- name: Upgrade one controller with preparation and restoration
  when: not ansible_check_mode
  block:
    - name: Prepare the controller operation
      ansible.builtin.include_tasks: controller-upgrade-prepare.yml

    - name: Run the controller kubeadm upgrade
      delegate_to: "{{ kubernetes_upgrade_host }}"
      changed_when: true
      async: 600
      poll: 5
      ansible.builtin.command:
        cmd: "{{ kubernetes_upgrade_command }}"

    - name: Reject unexpected proxy reconciliation before continuing
      when: kubernetes_remove_kube_proxy | bool
      ansible.builtin.include_tasks: kube-proxy-check.yml

    - name: Finish the kubeadm DNS operation before proceeding
      ansible.builtin.include_tasks: coredns-upgrade.yml

    - name: Wait for the control plane
      ansible.builtin.include_tasks: health-check.yml
  always:
    - name: Restore controller and application runtime state
      ansible.builtin.include_tasks: controller-upgrade-restore.yml
