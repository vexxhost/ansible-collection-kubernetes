---
- name: Restore controller ownership and application discovery
  block:
    - name: Inspect controller recovery state
      delegate_to: "{{ kubernetes_upgrade_host }}"
      ansible.builtin.stat:
        path: /var/lib/kubernetes/upgrade/controller-state.json
      register: kubernetes_controller_recovery_state

    - name: Restore the exact suspended kube-vip manifest
      when: kubernetes_controller_recovery_state.stat.exists
      delegate_to: "{{ kubernetes_upgrade_host }}"
      changed_when: true
      ansible.builtin.command:
        argv:
          - "{{ hostvars[kubernetes_upgrade_host].ansible_facts.python.executable | default('/usr/bin/python3') }}"
          - /var/lib/kubernetes/upgrade/controller.py
          - restore
  always:
    - name: Restore application compatibility after this controller
      when: kubernetes_upgrade_lifecycle_role | length > 0
      ansible.builtin.include_role:
        name: "{{ kubernetes_upgrade_lifecycle_role }}"
        tasks_from: restore
