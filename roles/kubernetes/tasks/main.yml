---
- name: Remove kubernetes repository
  ansible.builtin.apt_repository:
    repo: "{{ kubernetes_repository_apt }}"
    state: absent
  when: ansible_facts['os_family'] in ['Debian']

- name: Configure kubeadm patches
  ansible.builtin.include_tasks: kubeadm-patches.yml

- name: Record the node name for delegated upgrade operations
  ansible.builtin.set_fact:
    kubernetes_kubelet_node_name: "{{ kubelet_hostname }}"

- name: Setup control plane
  when: inventory_hostname in groups[kubernetes_control_plane_group]
  ansible.builtin.include_tasks: control-plane.yml

# NOTE: bootstrap-cluster.yml installs the guard before additional control
#       planes join. Repeat it here before worker setup so worker-only limited
#       runs cannot register a vulnerable, schedulable node first.
- name: Guard in-place pod resize on kubelets without pod QoS cgroups
  when: kubernetes_version is version('1.35.0', '>=')
  run_once: true
  ansible.builtin.include_tasks: resize-admission-guard.yml

- name: Setup nodes
  when: inventory_hostname not in groups[kubernetes_control_plane_group]
  ansible.builtin.include_tasks: nodes.yml

- name: Finish DNS reconciliation before upgrading kubelets
  when: ansible_play_hosts | intersect(groups[kubernetes_control_plane_group]) | length > 0
  run_once: true
  ansible.builtin.include_tasks: coredns-upgrade.yml

# NOTE: Upgrade one node at a time, control plane nodes first, and wait for
#       each node (and the control plane) to be healthy before the next one.
- name: Upgrade the kubelets one node at a time
  when: kubernetes_kubelet_upgrade | bool
  run_once: true
  ansible.builtin.include_tasks: kubelet-upgrade-node.yml
  loop: >-
    {{
      (ansible_play_hosts | select('in', groups[kubernetes_control_plane_group]) | list)
      + (ansible_play_hosts | reject('in', groups[kubernetes_control_plane_group]) | list)
    }}
  loop_control:
    loop_var: kubernetes_kubelet_upgrade_host

# NOTE: "kubeadm upgrade" can install kube-proxy again (from 1.33 it only
#       skips it when proxy.disabled is stored in the cluster configuration),
#       so remove it after the control plane and kubelets are upgraded.
- name: Remove kube-proxy resources
  when: kubernetes_remove_kube_proxy | bool
  run_once: true
  delegate_to: "{{ kubernetes_bootstrap_node | default(groups[kubernetes_control_plane_group][0]) }}"
  kubernetes.core.k8s:
    kubeconfig: /etc/kubernetes/admin.conf
    state: absent
    api_version: "{{ item.api_version }}"
    kind: "{{ item.kind }}"
    namespace: kube-system
    name: kube-proxy
  loop:
    - api_version: apps/v1
      kind: DaemonSet
    - api_version: v1
      kind: ConfigMap
