---
galaxy_info:
  author: VEXXHOST, Inc.
  description: Ansible role for Cluster API
  license: Apache-2.0
  min_ansible_version: 5.5.0
  standalone: false
  platforms:
    - name: EL
      versions:
        - "8"
        - "9"
    - name: Ubuntu
      versions:
        - focal
        - jammy

dependencies:
  - role: vexxhost.kubernetes.clusterctl
    vars:
      clusterctl_providers: "{{ _cluster_api_clusterctl_providers }}"
  - role: vexxhost.kubernetes.openstack_resource_controller
    when:
      - cluster_api_infrastructure_provider == "openstack"
      - cluster_api_infrastructure_version is version('0.12.0', '>=')
