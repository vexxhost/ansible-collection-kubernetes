---
_cluster_api_environment: |
  {% set res = {'CLUSTER_TOPOLOGY': 'true', 'EXP_CLUSTER_RESOURCE_SET': 'true'} -%}
  {% if cluster_api_github_token %}
  {%   set _ = res.update({'GITHUB_TOKEN': cluster_api_github_token}) %}
  {% endif %}
  {{ res }}

# Every provider that should be installed in the management cluster, in the
# order clusterctl installs them.
#
# The "label" is the "cluster.x-k8s.io/provider" label that clusterctl sets on
# every object of a provider, and the bundled manifests are stored in
# "files/providers/<label>/v<version>/<components>".
_cluster_api_providers: |
  {% set providers = [
    {'name': cluster_api_core_provider, 'type': 'CoreProvider',
     'label': cluster_api_core_provider,
     'version': cluster_api_core_version, 'components': 'core-components.yaml'},
    {'name': cluster_api_bootstrap_provider, 'type': 'BootstrapProvider',
     'label': 'bootstrap-' ~ cluster_api_bootstrap_provider,
     'version': cluster_api_bootstrap_version, 'components': 'bootstrap-components.yaml'},
    {'name': cluster_api_control_plane_provider, 'type': 'ControlPlaneProvider',
     'label': 'control-plane-' ~ cluster_api_control_plane_provider,
     'version': cluster_api_control_plane_version, 'components': 'control-plane-components.yaml'},
    {'name': cluster_api_infrastructure_provider, 'type': 'InfrastructureProvider',
     'label': 'infrastructure-' ~ cluster_api_infrastructure_provider,
     'version': cluster_api_infrastructure_version, 'components': 'infrastructure-components.yaml'},
  ] -%}
  {% for addon in cluster_api_addon_providers %}
  {%   set _ = providers.append({'name': addon.name, 'type': 'AddonProvider',
                                 'label': 'addon-' ~ addon.name,
                                 'version': addon.version | string | regex_replace('^v', ''),
                                 'components': 'addon-components.yaml', 'url': addon.url | default(none)}) %}
  {% endfor %}
  {% set res = [] -%}
  {% for provider in providers %}
  {%   set default_url = [cluster_api_provider_path, provider.label, 'v' ~ provider.version, provider.components] | join('/') %}
  {%   set _ = res.append(provider | combine({'url': provider.url | default(default_url, true)})) %}
  {% endfor %}
  {{ res }}

# Provider repositories written to the "clusterctl" configuration file.
_cluster_api_clusterctl_providers: |
  {% set res = [] -%}
  {% for provider in _cluster_api_providers %}
  {%   set _ = res.append({'name': provider.name, 'type': provider.type, 'url': provider.url}) %}
  {% endfor %}
  {{ res }}

# The "clusterctl" flag used to select each provider type.
_cluster_api_provider_flags:
  CoreProvider: --core
  BootstrapProvider: --bootstrap
  ControlPlaneProvider: --control-plane
  InfrastructureProvider: --infrastructure
  AddonProvider: --addon
