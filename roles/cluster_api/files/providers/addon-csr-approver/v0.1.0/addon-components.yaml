apiVersion: v1
kind: Namespace
metadata:
  labels:
    cluster.x-k8s.io/provider: addon-csr-approver
  name: capi-csr-approver-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    cluster.x-k8s.io/provider: addon-csr-approver
  name: capi-csr-approver-manager
  namespace: capi-csr-approver-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    cluster.x-k8s.io/provider: addon-csr-approver
  name: capi-csr-approver-leader-election-role
  namespace: capi-csr-approver-system
rules:
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    cluster.x-k8s.io/provider: addon-csr-approver
  name: capi-csr-approver-manager-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
- apiGroups:
  - cluster.x-k8s.io
  resources:
  - clusters
  - machines
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    cluster.x-k8s.io/provider: addon-csr-approver
  name: capi-csr-approver-leader-election-rolebinding
  namespace: capi-csr-approver-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: capi-csr-approver-leader-election-role
subjects:
- kind: ServiceAccount
  name: capi-csr-approver-manager
  namespace: capi-csr-approver-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    cluster.x-k8s.io/provider: addon-csr-approver
  name: capi-csr-approver-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: capi-csr-approver-manager-role
subjects:
- kind: ServiceAccount
  name: capi-csr-approver-manager
  namespace: capi-csr-approver-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    cluster.x-k8s.io/provider: addon-csr-approver
    control-plane: controller-manager
  name: capi-csr-approver-controller-manager
  namespace: capi-csr-approver-system
spec:
  replicas: 1
  selector:
    matchLabels:
      cluster.x-k8s.io/provider: addon-csr-approver
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        cluster.x-k8s.io/provider: addon-csr-approver
        control-plane: controller-manager
    spec:
      containers:
      - args:
        - --leader-elect
        - --cluster-selector=${CSR_APPROVER_CLUSTER_SELECTOR:=csr-approver.vexxhost.com/disabled!=true}
        - --deny-invalid=${CSR_APPROVER_DENY_INVALID:=false}
        - --max-expiration=${CSR_APPROVER_MAX_EXPIRATION:=0s}
        - --diagnostics-address=${CSR_APPROVER_DIAGNOSTICS_ADDRESS:=:8443}
        - --insecure-diagnostics=${CSR_APPROVER_INSECURE_DIAGNOSTICS:=false}
        - --v=${CSR_APPROVER_LOG_LEVEL:=2}
        command:
        - /manager
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        image: ghcr.io/vexxhost/cluster-api-csr-approver:v0.1.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: healthz
        name: manager
        ports:
        - containerPort: 9440
          name: healthz
          protocol: TCP
        - containerPort: 8443
          name: metrics
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: healthz
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsGroup: 65532
          runAsUser: 65532
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: capi-csr-approver-manager
      terminationGracePeriodSeconds: 10
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
