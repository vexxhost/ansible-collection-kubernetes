---
# Entries of kubernetes_upgrade_check_cgroups_per_qos_denylist that contain
# kubernetes_version
kubernetes_upgrade_check_cgroups_per_qos_denied_by: >-
  {{
    (
      kubernetes_upgrade_check_cgroups_per_qos_denylist
      | selectattr('min', 'ansible.builtin.version', kubernetes_version, '<=')
      | selectattr('max', 'undefined')
      | list
    ) + (
      kubernetes_upgrade_check_cgroups_per_qos_denylist
      | selectattr('min', 'ansible.builtin.version', kubernetes_version, '<=')
      | selectattr('max', 'defined')
      | selectattr('max', 'ansible.builtin.version', kubernetes_version, '>')
      | list
    )
  }}

# Entries of kubernetes_upgrade_check_cgroups_per_qos_resize_guard_versions that
# contain kubernetes_version
kubernetes_upgrade_check_cgroups_per_qos_resize_guarded_by: >-
  {{
    (
      kubernetes_upgrade_check_cgroups_per_qos_resize_guard_versions
      | selectattr('min', 'ansible.builtin.version', kubernetes_version, '<=')
      | selectattr('max', 'undefined')
      | list
    ) + (
      kubernetes_upgrade_check_cgroups_per_qos_resize_guard_versions
      | selectattr('min', 'ansible.builtin.version', kubernetes_version, '<=')
      | selectattr('max', 'defined')
      | selectattr('max', 'ansible.builtin.version', kubernetes_version, '>')
      | list
    )
  }}

# Inspect actual kubelet versions even when the target release is fixed.  A
# control-plane-only or interrupted upgrade can leave an older affected kubelet
# running after kubernetes_version has moved beyond its guarded range.
kubernetes_upgrade_check_cgroups_per_qos_inspection_required: >-
  {{
    kubernetes_upgrade_check_cgroups_per_qos_denied_by | length > 0
    or kubernetes_version is ansible.builtin.version(
      kubernetes_upgrade_check_cgroups_per_qos_resize_guard_min_version, '>='
    )
  }}
