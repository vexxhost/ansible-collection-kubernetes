---
# Kubernetes versions whose kubelet crashes on nodes that run pods without QoS
# cgroups (--cgroups-per-qos=false, which nodes deployed by older releases of
# this collection keep).  Each entry denies versions from "min" (inclusive) up
# to "max" (exclusive, or every later version if unset).  The role refuses to
# deploy or upgrade to a denied version while any node in the play runs
# without QoS cgroups; nodes with QoS cgroups are not affected.
#
# Kubernetes 1.35.9 and 1.36.4 backported kubernetes/kubernetes#140387, which
# makes the kubelet resize the pod when a container that is starting has no
# record of the resources applied to it.  Without QoS cgroups the kubelet
# never records them for new pods, so once the init containers of a pod with
# requests or limits finish, the kubelet resizes the pod and dereferences the
# nil pod cgroup configuration in doPodResizeAction, then crashes
# (kubernetes/kubernetes#137993).  kubernetes/kubernetes#137999 fixes the
# crash.  There is one entry per minor version because the fix will ship in a
# different patch release on each branch: when a branch gets it, set "max" on
# that branch's entry to the first fixed patch release.  The last entry stays
# open-ended until a release from master includes the fix.
kubernetes_upgrade_check_cgroups_per_qos_denylist:
  - min: "1.35.9"
    max: "1.36.0"
  - min: "1.36.4"
    max: "1.37.0"
  - min: "1.37.0"
