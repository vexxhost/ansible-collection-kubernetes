---
# Inventory group containing every Kubernetes node.  The preflight deliberately
# inspects the full group even when the play uses --limit: removing a
# cluster-wide admission guard based only on the limited hosts would expose the
# nodes omitted from the play.
kubernetes_upgrade_check_group: "{{ kubernetes_group | default('all') }}"

# Set this only for the first bootstrap of a cluster when no pre-existing
# Kubernetes API or out-of-inventory Node can exist.  It permits bootstrap to
# continue if the API is not available yet, and is honored only when the full
# Kubernetes inventory is in the play.  Never set it during recovery, reset,
# replacement, or rejoin operations.
kubernetes_upgrade_check_assert_fresh_bootstrap: false

# Kubernetes versions whose kubelet crashes on nodes that run pods without QoS
# cgroups (--cgroups-per-qos=false, which nodes deployed by older releases of
# this collection keep).  Each entry denies versions from "min" (inclusive) up
# to "max" (exclusive, or every later version if unset).  The role refuses to
# deploy or upgrade to a denied version while any node in the inventory group
# runs without QoS cgroups; nodes with QoS cgroups are not affected.
#
# Kubernetes 1.35.9 and 1.36.4 backported kubernetes/kubernetes#140387, which
# makes the kubelet resize the pod when a container that is starting has no
# record of the resources applied to it.  Without QoS cgroups the kubelet
# never records them for new pods, so once the init containers of a pod with
# requests or limits finish, the kubelet resizes the pod and dereferences the
# nil pod cgroup configuration in doPodResizeAction, then crashes
# (kubernetes/kubernetes#137993).  kubernetes/kubernetes#137999 fixes the
# crash.  There is one entry per minor version because the fix will ship in a
# different patch release on each branch: when a branch gets it, set "max" on
# that branch's entry to the first fixed patch release.  The last entry stays
# open-ended until a release from master includes the fix.
kubernetes_upgrade_check_cgroups_per_qos_denylist:
  - min: "1.35.9"
    max: "1.36.0"
  - min: "1.36.4"
    max: "1.37.0"
  - min: "1.37.0"

# Kubernetes versions whose kubelet can hit the same nil pod-cgroup panic when
# an API client explicitly updates the pods/resize subresource.  Unlike the
# automatic trigger covered by the denylist above, this path can be made safe
# with a ValidatingAdmissionPolicy.  Keep one range per minor so each branch can
# be closed independently at the first release containing
# kubernetes/kubernetes#137999.
kubernetes_upgrade_check_cgroups_per_qos_resize_guard_versions:
  - min: "1.35.0"
    max: "1.36.0"
  - min: "1.36.0"
    max: "1.37.0"
  - min: "1.37.0"
