---
# NOTE: Some kubelet versions crash on nodes without pod QoS cgroups (see
#       kubernetes_upgrade_check_cgroups_per_qos_denylist), so refuse them
#       before anything changes on any node.
- name: Check the kubelet version against nodes without pod QoS cgroups
  when: kubernetes_upgrade_check_cgroups_per_qos_denied_by | length > 0
  block:
    - name: Read the kubelet flags and configuration
      ansible.builtin.slurp:
        path: "{{ item }}"
      loop:
        - /var/lib/kubelet/kubeadm-flags.env
        - /etc/default/kubelet
        - /var/lib/kubelet/config.yaml
      register: kubernetes_upgrade_check_kubelet_files
      failed_when: false

    # NOTE: kubeadm writes kubeadm-flags.env when the node joins, with the
    #       kubelet arguments from kubernetes_kubeadm_extra_args, and keeps it
    #       on upgrades.  config.yaml is written again on joins and upgrades,
    #       with the kubeletconfiguration patch applied.
    - name: Check whether the kubelet runs pods in QoS cgroups
      vars:
        kubernetes_upgrade_check_kubelet_file_contents: >-
          {{
            kubernetes_upgrade_check_kubelet_files.results
            | selectattr('content', 'defined')
            | items2dict(key_name='item', value_name='content')
          }}
        kubernetes_upgrade_check_kubelet_extra_args: >-
          {{ (kubernetes_kubeadm_extra_args | default({})).kubelet | default({}, true) }}
        kubernetes_upgrade_check_kubelet_flags: >-
          {{
            [
              kubernetes_upgrade_check_kubelet_file_contents['/var/lib/kubelet/kubeadm-flags.env'] | b64decode
              if '/var/lib/kubelet/kubeadm-flags.env' in kubernetes_upgrade_check_kubelet_file_contents
              else (
                '--cgroups-per-qos=' ~ (kubernetes_upgrade_check_kubelet_extra_args['cgroups-per-qos'] | string | lower)
                if kubernetes_upgrade_check_kubelet_extra_args['cgroups-per-qos'] | default(none) is not none
                else ''
              ),
              kubernetes_upgrade_check_kubelet_file_contents['/etc/default/kubelet'] | default('') | b64decode,
            ]
          }}
        kubernetes_upgrade_check_kubelet_config: >-
          {{
            (
              kubernetes_upgrade_check_kubelet_file_contents['/var/lib/kubelet/config.yaml'] | b64decode | from_yaml
              if '/var/lib/kubelet/config.yaml' in kubernetes_upgrade_check_kubelet_file_contents
              else {}
            )
            | combine((kubernetes_kubeadm_patches | default({})).kubeletconfiguration | default({}, true))
          }}
      ansible.builtin.set_fact:
        kubernetes_upgrade_check_cgroups_per_qos: >-
          {{
            kubernetes_upgrade_check_kubelet_flags
            | vexxhost.kubernetes.kubelet_cgroups_per_qos(kubernetes_upgrade_check_kubelet_config)
          }}

    - name: Fail if the kubelet version crashes without pod QoS cgroups
      vars:
        kubernetes_upgrade_check_cgroups_per_qos_disabled_hosts: >-
          {{
            ansible_play_hosts
            | map('extract', hostvars)
            | selectattr('kubernetes_upgrade_check_cgroups_per_qos', 'defined')
            | rejectattr('kubernetes_upgrade_check_cgroups_per_qos')
            | map(attribute='inventory_hostname')
            | list
          }}
      when: kubernetes_upgrade_check_cgroups_per_qos_disabled_hosts | length > 0
      ansible.builtin.fail:
        msg: |
          Refusing to deploy Kubernetes {{ kubernetes_version }}: its kubelet
          crashes on nodes that run pods without QoS cgroups
          (--cgroups-per-qos=false), and these nodes do:
          {{ kubernetes_upgrade_check_cgroups_per_qos_disabled_hosts | join(', ') }}

          Without QoS cgroups, resizing can dereference a nil pod cgroup
          configuration (kubernetes/kubernetes#137993, addressed by
          kubernetes/kubernetes#137999). This was reproduced with an explicit
          in-place resize on stock 1.36.2. Kubernetes 1.35.9 and 1.36.4 also
          trigger the resize path when a container starts without a record of
          the resources applied to it.

          Use a kubelet release verified to include the fix, or move these
          nodes to QoS cgroups first, which restarts their pods. A version
          outside kubernetes_upgrade_check_cgroups_per_qos_denylist is not
          necessarily unaffected by the underlying resize bug.

- name: Retrieve the "kubeadm-config" ConfigMap
  run_once: true
  delegate_to: "{{ groups[kubernetes_control_plane_group | default('controllers')][0] }}"
  ignore_errors: true
  kubernetes.core.k8s_info:
    kubeconfig: /etc/kubernetes/admin.conf
    api_version: v1
    kind: ConfigMap
    name: kubeadm-config
    namespace: kube-system
  register: kubernetes_upgrade_check_kubeadm_config

- name: Determine if we are jumping multiple versions
  when:
    - kubernetes_upgrade_check_kubeadm_config is not failed
    - kubernetes_upgrade_check_kubeadm_config.resources is defined
    - kubernetes_upgrade_check_kubeadm_config.resources | length > 0
  block:
    - name: Parse the ClusterConfiguration
      run_once: true
      ansible.builtin.set_fact:
        kubernetes_upgrade_check_cluster_configuration: "{{ kubernetes_upgrade_check_kubeadm_config.resources[0].data.ClusterConfiguration | from_yaml }}" # yamllint disable-line rule:line-length

    - name: Retrieve the current Kubernetes version
      run_once: true
      ansible.builtin.set_fact:
        kubernetes_upgrade_check_cluster_version: "{{ kubernetes_upgrade_check_cluster_configuration.kubernetesVersion | regex_replace('^v', '') }}" # yamllint disable-line rule:line-length

    - name: Extract major, minor, and patch versions
      run_once: true
      ansible.builtin.set_fact:
        kubernetes_upgrade_check_current_major: "{{ kubernetes_upgrade_check_cluster_version.split('.')[0] | int }}"
        kubernetes_upgrade_check_current_minor: "{{ kubernetes_upgrade_check_cluster_version.split('.')[1] | int }}"
        kubernetes_upgrade_check_current_patch: "{{ kubernetes_upgrade_check_cluster_version.split('.')[2] | int }}"
        kubernetes_upgrade_check_desired_major: "{{ kubernetes_version.split('.')[0] | int }}"
        kubernetes_upgrade_check_desired_minor: "{{ kubernetes_version.split('.')[1] | int }}"
        kubernetes_upgrade_check_desired_patch: "{{ kubernetes_version.split('.')[2] | int }}"

    - name: Fail if the target version is older than the cluster version
      ansible.builtin.fail:
        msg: |
          The target Kubernetes version {{ kubernetes_version }} is older than
          the current cluster version {{ kubernetes_upgrade_check_cluster_version }}.
          Downgrading Kubernetes is not supported.
      when:
        - kubernetes_version is version(kubernetes_upgrade_check_cluster_version, '<')

    - name: Fail if a limited worker run is newer than the control plane
      ansible.builtin.fail:
        msg: |
          Refusing to upgrade worker {{ inventory_hostname }} to Kubernetes
          {{ kubernetes_version }} because the control plane is still on
          {{ kubernetes_upgrade_check_cluster_version }} and not every control
          plane node is part of this play. Upgrade the control plane first;
          workers must not run a newer version than the control plane.
      when:
        - inventory_hostname not in groups[kubernetes_control_plane_group | default('controllers')]
        - kubernetes_version is version(kubernetes_upgrade_check_cluster_version, '>')
        - >-
          (ansible_play_hosts_all | select('in', groups[kubernetes_control_plane_group | default('controllers')]) | list | length)
          < (groups[kubernetes_control_plane_group | default('controllers')] | length)

    - name: Fail if we're jumping more than one minor version
      ansible.builtin.fail:
        msg: |
          The target version is more than one minor version ahead of the current
          version. Please upgrade to the next minor version first.
      when:
        - kubernetes_upgrade_check_desired_major == kubernetes_upgrade_check_current_major
        - ((kubernetes_upgrade_check_desired_minor | int) > (kubernetes_upgrade_check_current_minor | int + 1)) or (kubernetes_upgrade_check_desired_minor < kubernetes_upgrade_check_current_minor) # yamllint disable-line rule:line-length

    - name: Set fact if we need to upgrade
      ansible.builtin.set_fact:
        kubernetes_upgrade_check_upgrade_required: "{{ kubernetes_upgrade_check_cluster_version != kubernetes_version }}"
