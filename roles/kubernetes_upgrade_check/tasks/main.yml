---
# NOTE: The guard depends on the full cluster even under --limit. Query through
#       the API so an unavailable inventory host does not block replacement or
#       recovery work. configz contains the effective value after flags have
#       been applied, and Node status contains the running kubelet version.
- name: Record Kubernetes Node names for hosts in the play
  when: kubernetes_upgrade_check_cgroups_per_qos_inspection_required | bool
  ansible.builtin.set_fact:
    kubernetes_upgrade_check_node_name: >-
      {{ kubelet_hostname | default(inventory_hostname_short) }}

- name: Initialize the Kubernetes inventory node map
  when: kubernetes_upgrade_check_cgroups_per_qos_inspection_required | bool
  run_once: true
  ansible.builtin.set_fact:
    kubernetes_upgrade_check_inventory_nodes: {}

- name: Map inventory hosts to Kubernetes Node names
  when: kubernetes_upgrade_check_cgroups_per_qos_inspection_required | bool
  run_once: true
  ansible.builtin.set_fact:
    kubernetes_upgrade_check_inventory_nodes: >-
      {{
        kubernetes_upgrade_check_inventory_nodes
        | combine({
            item: hostvars[item].kubernetes_upgrade_check_node_name
                  | default(hostvars[item].kubelet_hostname)
                  | default(hostvars[item].inventory_hostname_short)
          })
      }}
  loop: "{{ groups[kubernetes_upgrade_check_group] }}"

- name: Initialize Kubernetes API inspection
  when: kubernetes_upgrade_check_cgroups_per_qos_inspection_required | bool
  run_once: true
  ansible.builtin.set_fact:
    kubernetes_upgrade_check_api_inspection: {}
    kubernetes_upgrade_check_api_delegates: >-
      {{
        (
          ([kubernetes_bootstrap_node] if kubernetes_bootstrap_node is defined else [])
          + groups[kubernetes_control_plane_group | default('controllers')]
        )
        | unique
      }}

# Try an explicitly selected bootstrap node first, then every control-plane
# host. A transport or module failure leaves this attempt unavailable and the
# next candidate is tried. If none work, play hosts use local fallback evidence
# and hosts outside the play remain conservatively unknown.
- name: Inspect kubelets through a reachable Kubernetes API delegate
  when: kubernetes_upgrade_check_cgroups_per_qos_inspection_required | bool
  run_once: true
  ansible.builtin.include_tasks: kubelet-configz-delegate.yml
  loop: "{{ kubernetes_upgrade_check_api_delegates }}"
  loop_control:
    loop_var: kubernetes_upgrade_check_api_delegate

- name: Record API kubelet inspection results # noqa: jinja[invalid]
  when: kubernetes_upgrade_check_cgroups_per_qos_inspection_required | bool
  run_once: true
  vars:
    kubernetes_upgrade_check_api_node: >-
      {{
        kubernetes_upgrade_check_api_inspection.nodes[item.value]
        if (
          kubernetes_upgrade_check_api_inspection.nodes is defined
          and item.value in kubernetes_upgrade_check_api_inspection.nodes
        )
        else {
          'exists': false,
          'cgroups_per_qos': none,
          'kubelet_version': '',
          'error': 'Kubernetes API inspection was unavailable through every control-plane delegate',
        }
      }}
    kubernetes_upgrade_check_api_cgroups_state: >-
      {{
        'enabled'
        if kubernetes_upgrade_check_api_node.cgroups_per_qos is sameas true
        else (
          'disabled'
          if kubernetes_upgrade_check_api_node.cgroups_per_qos is sameas false
          else 'unknown'
        )
      }}
    kubernetes_upgrade_check_api_kubelet_version: >-
      {{ kubernetes_upgrade_check_api_node.kubelet_version | default('') }}
  # Some Ansible versions template delegate_to before evaluating the task's
  # when expression. Keep the skipped bootstrap path valid before an item
  # exists.
  delegate_to: "{{ item.key | default(inventory_hostname) }}"
  delegate_facts: true
  ansible.builtin.set_fact:
    kubernetes_upgrade_check_node_exists: >-
      {{ kubernetes_upgrade_check_api_node.exists }}
    kubernetes_upgrade_check_cgroups_per_qos_state: >-
      {{ kubernetes_upgrade_check_api_cgroups_state }}
    kubernetes_upgrade_check_kubelet_version: >-
      {{ kubernetes_upgrade_check_api_kubelet_version }}
    kubernetes_upgrade_check_inspection_error: >-
      {{ kubernetes_upgrade_check_api_node.error | default('') }}
    kubernetes_upgrade_check_kubelet_resize_guard_required: >-
      {{
        kubernetes_upgrade_check_api_cgroups_state == 'unknown'
        or (
          kubernetes_upgrade_check_api_cgroups_state == 'disabled'
          and (
            kubernetes_upgrade_check_api_kubelet_version | length == 0
            or kubernetes_upgrade_check_api_kubelet_version
               | vexxhost.kubernetes.version_matching_ranges(
                   kubernetes_upgrade_check_cgroups_per_qos_resize_guard_versions
                 )
               | length > 0
          )
        )
      }}
  loop: "{{ kubernetes_upgrade_check_inventory_nodes | dict2items }}"

# A play host missing from the API is being bootstrapped or rejoined. When the
# whole API is unavailable (including initial bootstrap), local files are also
# the best available evidence. Hosts omitted by --limit remain unknown; do not
# open SSH connections to them.
- name: Inspect play hosts unavailable through the Kubernetes API
  when:
    - kubernetes_upgrade_check_cgroups_per_qos_inspection_required | bool
    - >-
      hostvars[kubernetes_upgrade_check_cgroups_per_qos_host].kubernetes_upgrade_check_node_exists
      is not sameas true
  run_once: true
  ansible.builtin.include_tasks: cgroups-per-qos-node.yml
  loop: "{{ ansible_play_hosts_all }}"
  loop_control:
    loop_var: kubernetes_upgrade_check_cgroups_per_qos_host

- name: Record the cluster pod QoS cgroup state
  vars:
    kubernetes_upgrade_check_detected_inspected_hosts: >-
      {{
        groups[kubernetes_upgrade_check_group]
        | map('extract', hostvars)
        | selectattr('kubernetes_upgrade_check_cgroups_per_qos_state', 'defined')
        | rejectattr('kubernetes_upgrade_check_cgroups_per_qos_state', 'equalto', 'unknown')
        | map(attribute='inventory_hostname')
        | list
      }}
    kubernetes_upgrade_check_detected_disabled_hosts: >-
      {{
        groups[kubernetes_upgrade_check_group]
        | map('extract', hostvars)
        | selectattr('kubernetes_upgrade_check_cgroups_per_qos_state', 'defined')
        | selectattr('kubernetes_upgrade_check_cgroups_per_qos_state', 'equalto', 'disabled')
        | map(attribute='inventory_hostname')
        | list
      }}
    kubernetes_upgrade_check_detected_unknown_hosts: >-
      {{
        groups[kubernetes_upgrade_check_group]
        | map('extract', hostvars)
        | selectattr('kubernetes_upgrade_check_cgroups_per_qos_state', 'defined')
        | selectattr('kubernetes_upgrade_check_cgroups_per_qos_state', 'equalto', 'unknown')
        | map(attribute='inventory_hostname')
        | list
      }}
    kubernetes_upgrade_check_detected_resize_guard_hosts: >-
      {{
        groups[kubernetes_upgrade_check_group]
        | map('extract', hostvars)
        | selectattr('kubernetes_upgrade_check_kubelet_resize_guard_required', 'defined')
        | selectattr('kubernetes_upgrade_check_kubelet_resize_guard_required')
        | map(attribute='inventory_hostname')
        | list
      }}
  ansible.builtin.set_fact:
    kubernetes_upgrade_check_cgroups_per_qos_inspected_hosts: >-
      {{
        kubernetes_upgrade_check_detected_inspected_hosts
        if kubernetes_upgrade_check_cgroups_per_qos_inspection_required | bool
        else []
      }}
    kubernetes_upgrade_check_cgroups_per_qos_disabled_hosts: >-
      {{
        kubernetes_upgrade_check_detected_disabled_hosts
        if kubernetes_upgrade_check_cgroups_per_qos_inspection_required | bool
        else []
      }}
    kubernetes_upgrade_check_cgroups_per_qos_resize_guard_hosts: >-
      {{
        kubernetes_upgrade_check_detected_resize_guard_hosts
        if kubernetes_upgrade_check_cgroups_per_qos_inspection_required | bool
        else []
      }}
    kubernetes_upgrade_check_cgroups_per_qos_unknown_hosts: >-
      {{
        kubernetes_upgrade_check_detected_unknown_hosts
        if kubernetes_upgrade_check_cgroups_per_qos_inspection_required | bool
        else []
      }}
    kubernetes_upgrade_check_resize_admission_guard_required: >-
      {{
        (
          kubernetes_upgrade_check_cgroups_per_qos_resize_guarded_by | length > 0
          and kubernetes_upgrade_check_detected_disabled_hosts | length > 0
        )
        or kubernetes_upgrade_check_detected_resize_guard_hosts | length > 0
      }}

- name: Report nodes with unknown pod QoS cgroup state
  when: kubernetes_upgrade_check_cgroups_per_qos_unknown_hosts | length > 0
  run_once: true
  ansible.builtin.debug:
    msg: >-
      Could not determine the effective pod QoS cgroup state of:
      {{ kubernetes_upgrade_check_cgroups_per_qos_unknown_hosts | join(', ') }}.
      The resize admission guard will remain installed. Targets in
      kubernetes_upgrade_check_cgroups_per_qos_denylist remain blocked, but
      unavailable nodes do not prevent recovery or replacement runs.

- name: Fail if the kubelet version crashes without pod QoS cgroups
  when:
    - kubernetes_upgrade_check_cgroups_per_qos_denied_by | length > 0
    - >-
      kubernetes_upgrade_check_cgroups_per_qos_disabled_hosts
      | union(kubernetes_upgrade_check_cgroups_per_qos_unknown_hosts)
      | length > 0
  ansible.builtin.fail:
    msg: |
      Refusing to deploy Kubernetes {{ kubernetes_version }}: its kubelet
      crashes on nodes that run pods without QoS cgroups
      (--cgroups-per-qos=false). These nodes have it disabled:
      {{ kubernetes_upgrade_check_cgroups_per_qos_disabled_hosts | join(', ') | default('none', true) }}
      These nodes could not be inspected safely:
      {{ kubernetes_upgrade_check_cgroups_per_qos_unknown_hosts | join(', ') | default('none', true) }}

      Kubernetes 1.35.9 and 1.36.4 made the kubelet resize a pod when a
      container starts without a record of the resources applied to it.
      Without QoS cgroups the kubelet never records them for new pods, and
      the resize dereferences a nil pod cgroup configuration
      (kubernetes/kubernetes#137993, fixed by the unmerged
      kubernetes/kubernetes#137999).

      Use a version outside kubernetes_upgrade_check_cgroups_per_qos_denylist
      (for example 1.35.8 or 1.36.3), or move these nodes to QoS cgroups
      first, which restarts their pods. See docs/ops/qos-cgroups.md.

- name: Retrieve the "kubeadm-config" ConfigMap
  run_once: true
  delegate_to: "{{ groups[kubernetes_control_plane_group | default('controllers')][0] }}"
  ignore_errors: true
  kubernetes.core.k8s_info:
    kubeconfig: /etc/kubernetes/admin.conf
    api_version: v1
    kind: ConfigMap
    name: kubeadm-config
    namespace: kube-system
  register: kubernetes_upgrade_check_kubeadm_config

- name: Determine if we are jumping multiple versions
  when:
    - kubernetes_upgrade_check_kubeadm_config is not failed
    - kubernetes_upgrade_check_kubeadm_config.resources is defined
    - kubernetes_upgrade_check_kubeadm_config.resources | length > 0
  block:
    - name: Parse the ClusterConfiguration
      run_once: true
      ansible.builtin.set_fact:
        kubernetes_upgrade_check_cluster_configuration: "{{ kubernetes_upgrade_check_kubeadm_config.resources[0].data.ClusterConfiguration | from_yaml }}" # yamllint disable-line rule:line-length

    - name: Retrieve the current Kubernetes version
      run_once: true
      ansible.builtin.set_fact:
        kubernetes_upgrade_check_cluster_version: "{{ kubernetes_upgrade_check_cluster_configuration.kubernetesVersion | regex_replace('^v', '') }}" # yamllint disable-line rule:line-length

    - name: Extract major, minor, and patch versions
      run_once: true
      ansible.builtin.set_fact:
        kubernetes_upgrade_check_current_major: "{{ kubernetes_upgrade_check_cluster_version.split('.')[0] | int }}"
        kubernetes_upgrade_check_current_minor: "{{ kubernetes_upgrade_check_cluster_version.split('.')[1] | int }}"
        kubernetes_upgrade_check_current_patch: "{{ kubernetes_upgrade_check_cluster_version.split('.')[2] | int }}"
        kubernetes_upgrade_check_desired_major: "{{ kubernetes_version.split('.')[0] | int }}"
        kubernetes_upgrade_check_desired_minor: "{{ kubernetes_version.split('.')[1] | int }}"
        kubernetes_upgrade_check_desired_patch: "{{ kubernetes_version.split('.')[2] | int }}"

    - name: Fail if the target version is older than the cluster version
      ansible.builtin.fail:
        msg: |
          The target Kubernetes version {{ kubernetes_version }} is older than
          the current cluster version {{ kubernetes_upgrade_check_cluster_version }}.
          Downgrading Kubernetes is not supported.
      when:
        - kubernetes_version is version(kubernetes_upgrade_check_cluster_version, '<')

    - name: Fail if a limited worker run is newer than the control plane
      ansible.builtin.fail:
        msg: |
          Refusing to upgrade worker {{ inventory_hostname }} to Kubernetes
          {{ kubernetes_version }} because the control plane is still on
          {{ kubernetes_upgrade_check_cluster_version }} and not every control
          plane node is part of this play. Upgrade the control plane first;
          workers must not run a newer version than the control plane.
      when:
        - inventory_hostname not in groups[kubernetes_control_plane_group | default('controllers')]
        - kubernetes_version is version(kubernetes_upgrade_check_cluster_version, '>')
        - >-
          (ansible_play_hosts_all | select('in', groups[kubernetes_control_plane_group | default('controllers')]) | list | length)
          < (groups[kubernetes_control_plane_group | default('controllers')] | length)

    - name: Fail if we're jumping more than one minor version
      ansible.builtin.fail:
        msg: |
          The target version is more than one minor version ahead of the current
          version. Please upgrade to the next minor version first.
      when:
        - kubernetes_upgrade_check_desired_major == kubernetes_upgrade_check_current_major
        - ((kubernetes_upgrade_check_desired_minor | int) > (kubernetes_upgrade_check_current_minor | int + 1)) or (kubernetes_upgrade_check_desired_minor < kubernetes_upgrade_check_current_minor) # yamllint disable-line rule:line-length

    - name: Set fact if we need to upgrade
      ansible.builtin.set_fact:
        kubernetes_upgrade_check_upgrade_required: "{{ kubernetes_upgrade_check_cluster_version != kubernetes_version }}"
